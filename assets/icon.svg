<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     shape-rendering="geometricPrecision">
  <!-- ============================================================
       MOT app icon — v2 design
       深哑光黑色背景 + 终端绿 #00FF41 大O (主体+静态多环发光) + 白色小字 M/T
       中心对称, 大量留白, 无 filter/渐变/阴影
       ============================================================ -->

  <!-- 背景: 深哑光黑色圆角正方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="#0A0A0A"/>

  <!-- O 外发光 (静态多环模拟, alpha 从外到内递增, 必须先于主体绘制) -->
  <path d="M 154 512 A 358 358 0 1 1 870 512 A 358 358 0 1 1 154 512
           M 186 512 A 326 326 0 1 0 838 512 A 326 326 0 1 0 186 512 Z"
        fill="#00FF41" fill-opacity="0.06" fill-rule="evenodd"/>
  <path d="M 176 512 A 336 336 0 1 1 848 512 A 336 336 0 1 1 176 512
           M 200 512 A 312 312 0 1 0 824 512 A 312 312 0 1 0 200 512 Z"
        fill="#00FF41" fill-opacity="0.12" fill-rule="evenodd"/>
  <path d="M 196 512 A 316 316 0 1 1 828 512 A 316 316 0 1 1 196 512
           M 212 512 A 300 300 0 1 0 812 512 A 300 300 0 1 0 212 512 Z"
        fill="#00FF41" fill-opacity="0.22" fill-rule="evenodd"/>

  <!-- O 主体: 实心圆环, 厚壁饱满, 内孔紧凑 (外径 300, 内径 170, 环壁厚 130) -->
  <path d="M 212 512 A 300 300 0 1 1 812 512 A 300 300 0 1 1 212 512
           M 342 512 A 170 170 0 1 0 682 512 A 170 170 0 1 0 342 512 Z"
        fill="#00FF41" fill-rule="evenodd"/>

  <!-- M 字母 (左侧白色小字, 高 432, 中心 y=512 与 O 中心对齐) -->
  <!-- 区域 x ∈ [56, 184], 右边缘 x=184 与 O 左边缘 x=212 间距 28 -->
  <path d="M 56 728
           L 56 296
           L 96 296
           L 120 408
           L 144 296
           L 184 296
           L 184 728
           L 160 728
           L 160 432
           L 132 544
           L 108 544
           L 80 432
           L 80 728 Z"
        fill="#FFFFFF"/>

  <!-- T 字母 (右侧白色小字, 与 M 镜像) -->
  <!-- 区域 x ∈ [840, 968], 左边缘 x=840 与 O 右边缘 x=812 间距 28 -->
  <path d="M 840 296
           L 968 296
           L 968 336
           L 916 336
           L 916 728
           L 892 728
           L 892 336
           L 840 336 Z"
        fill="#FFFFFF"/>
</svg>
