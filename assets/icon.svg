<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     shape-rendering="geometricPrecision">
  <!-- ============================================================
       MOT app icon — v2 design
       深哑光黑色背景 + 终端绿 #00FF41 大O (主体+静态多环发光) + 白色小字 M/T
       中心对称, 大量留白, 无 filter/渐变/阴影
       ============================================================ -->

  <!-- 背景: 深哑光黑色圆角正方形 -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" ry="180" fill="#0A0A0A"/>

  <!-- O 外发光 (静态多环模拟, alpha 从外到内递增, 必须先于主体绘制) -->
  <!-- O 主体外径 r=200 (直径 400, 占图标 39%), 发光环最外 r=258, 衰减 24/18/14 -->
  <path d="M 254 512 A 258 258 0 1 1 770 512 A 258 258 0 1 1 254 512
           M 282 512 A 230 230 0 1 0 742 512 A 230 230 0 1 0 282 512 Z"
        fill="#00FF41" fill-opacity="0.06" fill-rule="evenodd"/>
  <path d="M 272 512 A 240 240 0 1 1 752 512 A 240 240 0 1 1 272 512
           M 290 512 A 222 222 0 1 0 734 512 A 222 222 0 1 0 290 512 Z"
        fill="#00FF41" fill-opacity="0.12" fill-rule="evenodd"/>
  <path d="M 286 512 A 226 226 0 1 1 738 512 A 226 226 0 1 1 286 512
           M 298 512 A 214 214 0 1 0 726 512 A 214 214 0 1 0 298 512 Z"
        fill="#00FF41" fill-opacity="0.22" fill-rule="evenodd"/>

  <!-- O 主体: 实心圆环, 厚壁饱满, 内孔紧凑 (外径 200, 内径 100, 环壁厚 100) -->
  <!-- 范围: x ∈ [312, 712], y ∈ [312, 712] -->
  <path d="M 312 512 A 200 200 0 1 1 712 512 A 200 200 0 1 1 312 512
           M 412 512 A 100 100 0 1 0 612 512 A 100 100 0 1 0 412 512 Z"
        fill="#00FF41" fill-rule="evenodd"/>

  <!-- M 字母 (左侧白色, 高 432 = y∈[296,728], 笔画宽度 36, 中心 x=160) -->
  <!-- 区域 x ∈ [80, 240], 右边缘 x=240 与 O 左边缘 x=312 间距 72 -->
  <!-- 几何对称 M: 左竖 (x=80~116) + 中央 V 顶尖 (y=460) + 右竖 (x=204~240) -->
  <!-- 内 V 底端 y=552 = 上下总高的 0.595 处, 外侧高度 = 432 (顶 296, 底 728) -->
  <path d="M 80 728
           L 80 296
           L 124 296
           L 160 460
           L 196 296
           L 240 296
           L 240 728
           L 204 728
           L 204 416
           L 178 552
           L 142 552
           L 116 416
           L 116 728 Z"
        fill="#FFFFFF"/>

  <!-- T 字母 (右侧白色, 高 432 = y∈[296,728], 笔画宽度 36) -->
  <!-- 区域 x ∈ [784, 944], 左边缘 x=784 与 O 右边缘 x=712 间距 72 -->
  <!-- 顶部横杠 y∈[296,332] (高 36, 满宽 160), 中央竖杠 x∈[846,882] (宽 36, 高 432) -->
  <path d="M 784 296
           L 944 296
           L 944 332
           L 882 332
           L 882 728
           L 846 728
           L 846 332
           L 784 332 Z"
        fill="#FFFFFF"/>
</svg>
