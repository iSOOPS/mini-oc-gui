<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     width="32" height="32"
     shape-rendering="crispEdges">
  <!-- ============================================================
       MOT app icon — pixel-art v3 (32x32 native grid)
       viewBox = 32x32, 每个 viewBox 单位 = 1 像素
       resvg 整数倍放大 (16×→512, 8×→256 等) 配合 crispEdges
       天然 nearest-neighbor, 无抗锯齿阶梯
       ============================================================ -->

  <!-- 背景: 深哑光黑色实心 (占满 32x32) -->
  <rect x="0" y="0" width="32" height="32" fill="#0A0A0A"/>

  <!-- ============================================================
       O 方形环 (32-grid 像素阵列)
       外框: x∈[9,23], y∈[9,23]  (14x14, 中心 16,16)
       内孔: x∈[13,19], y∈[13,19]  (6x6)
       环壁厚 4 像素
       4 段矩形拼装, 中间自然镂空
       ============================================================ -->
  <rect x="9"  y="9"  width="14" height="4" fill="#00FF41"/>  <!-- O 上 -->
  <rect x="9"  y="19" width="14" height="4" fill="#00FF41"/>  <!-- O 下 -->
  <rect x="9"  y="13" width="4"  height="6" fill="#00FF41"/>  <!-- O 左 -->
  <rect x="19" y="13" width="4"  height="6" fill="#00FF41"/>  <!-- O 右 -->

  <!-- ============================================================
       M 字母 (左侧白色像素风, 5 列 × 7 行)
       区域: x ∈ [2, 7], y ∈ [13, 20]
       像素阵列 (1=填充, 0=空):
         y=13: 1 1 0 1 1   左竖 + V左上 + . + V右上 + 右竖
         y=14: 1 1 0 1 1
         y=15: 1 0 1 0 1   左竖 + . + V尖 + . + 右竖
         y=16: 1 0 1 0 1
         y=17: 1 0 0 0 1
         y=18: 1 0 0 0 1
         y=19: 1 0 0 0 1
       列定义: x=2, 3, 4, 5, 6
       ============================================================ -->

  <!-- 左竖 (列 0, x=2, y=13..19) -->
  <rect x="2" y="13" width="1" height="7" fill="#FFFFFF"/>
  <!-- 右竖 (列 4, x=6, y=13..19) -->
  <rect x="6" y="13" width="1" height="7" fill="#FFFFFF"/>

  <!-- V 左斜 (列 1, x=3, y=13..14, 高 2 像素) -->
  <rect x="3" y="13" width="1" height="2" fill="#FFFFFF"/>
  <!-- V 右斜 (列 3, x=5, y=13..14, 高 2 像素) -->
  <rect x="5" y="13" width="1" height="2" fill="#FFFFFF"/>
  <!-- V 顶尖 (列 2, x=4, y=15..16, 高 2 像素) -->
  <rect x="4" y="15" width="1" height="2" fill="#FFFFFF"/>

  <!-- ============================================================
       T 字母 (右侧白色像素风, 5 列 × 7 行)
       区域: x ∈ [25, 30], y ∈ [13, 20]
       像素阵列:
         y=13: 1 1 1 1 1   顶横满宽
         y=14: 0 0 1 0 0
         y=15: 0 0 1 0 0
         y=16: 0 0 1 0 0
         y=17: 0 0 1 0 0
         y=18: 0 0 1 0 0
         y=19: 0 0 1 0 0   竖杠到底
       列定义: x=25, 26, 27, 28, 29
       ============================================================ -->

  <!-- T 顶横 (x=25..29, y=13, 满宽 5 像素) -->
  <rect x="25" y="13" width="5" height="1" fill="#FFFFFF"/>
  <!-- T 中央竖 (列 2, x=27, y=14..19, 高 6 像素) -->
  <rect x="27" y="14" width="1" height="6" fill="#FFFFFF"/>

</svg>
