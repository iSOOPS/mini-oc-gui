[package]
name = "mini-oc-gui-serve"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "opencode serve + path-list actuator in Rust (Axum web + ratatui TUI)"
license = "MIT"
repository = "https://github.com/localhost/mini-oc-gui-serve"
readme = "README.md"

[[bin]]
name = "mini-oc-gui-serve"
path = "src/main.rs"

[[bin]]
name = "path-list-actor"
path = "src/bin/path-list-actor.rs"

[lib]
name = "mini_oc_gui_serve"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
hyper = { version = "1", features = ["server", "http1"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# HTTP client (remote SilverBullet sync).
# By default we ship WITHOUT TLS so the project builds on dev machines
# without a C compiler (ring/aws-lc-rs both require native toolchains).
# The local `path-list.md` cache + JSON merge work without any HTTP. To
# enable remote sync against an HTTPS SilverBullet, install a C compiler
# and re-enable the `tls` feature:
#
#   cargo build --features remote-tls
#
# (then add the corresponding deps back into this [dependencies] block).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "1"
anyhow = "1"

# Time / IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config (env vars)
dotenvy = "0.15"

# Path validation & file IO
path-clean = "1"
percent-encoding = "2"
dirs = "5"

# Auth
base64 = "0.22"
# We deliberately do NOT depend on `jsonwebtoken` or any other JWT crate:
# their default crypto backend is `ring` (needs a C compiler), and even
# `aws-lc-rs` requires native build tools. Instead, we hand-roll a
# minimal JWT `exp` validator in `auth/session.rs` using only `base64` +
# `serde_json` — sufficient for our "fail fast on stale tokens" check,
# since signature verification is delegated to the upstream server.
rand = "0.8"

# TUI
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }

# Clipboard (copy selected log text). Pure-Rust on Windows (win32 API via
# windows-sys), so it doesn't drag in a C compiler the way ring/aws-lc do.
arboard = "3"

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Process management
nix = { version = "0.29", features = ["signal", "process"] }

# File locking for concurrent-safe JSON cache
fs2 = "0.4"

# Force the pure-Rust `getrandom` backend so the test build doesn't drag
# in `dlltool` / `cc` (binutils are not in the minimal rustup GNU
# toolchain). The default `getrandom` build on Windows-GNU invokes
# `dlltool` to generate a def file; disabling the `std` feature uses
# the pure-Rust fallback instead.
getrandom = { version = "0.2", default-features = false }

[dev-dependencies]
tempfile = "3"
mockall = "0.13"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
